name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Resolve frontend environment
        env:
          RAW_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          RAW_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH }}
        run: |
          if [ -z "$RAW_API_URL" ]; then
            echo "Repository variable NEXT_PUBLIC_API_URL is required for GitHub Pages deployment." >&2
            exit 1
          fi

          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          BASE_PATH="$RAW_BASE_PATH"

          if [ -z "$BASE_PATH" ]; then
            BASE_PATH="/$REPO_NAME"
          fi

          {
            echo "NEXT_PUBLIC_API_URL=$RAW_API_URL"
            echo "NEXT_PUBLIC_BASE_PATH=$BASE_PATH"
          } >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build static export
        run: npm run build

      - name: Add GitHub Pages markers
        env:
          PAGES_CNAME: ${{ vars.PAGES_CNAME }}
        run: |
          touch out/.nojekyll
          if [ -n "$PAGES_CNAME" ]; then
            printf '%s\n' "$PAGES_CNAME" > out/CNAME
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
